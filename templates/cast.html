{% extends "base.html" %}

{% block title %}Reparto{% endblock %}

{% block content %}
<h1>Reparto {{ title }}</h1>
{% include "buttons.html" %}
<table>
    <thead>
        <tr>
            <th style="text-align: left;">Personaje</th>
            <th style="text-align: left;">Nombre</th>
        </tr>
    </thead>
    <tbody>
        {% for person in persons %}
        <tr>
            <td>
                {% if person.profile_path %}
                <img src="https://image.tmdb.org/t/p/w92{{ person.profile_path }}" alt="{{ person.name }}">
                {% endif %}
            </td>
            <td>{{ person.character }}</td>
            <td><a href="/related-movies/{{ person.id }}?name={{ person.name }}">{{ person.name }}</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
